<!doctype html>
<html lang="en", data-bs-theme="{{ request.session.theme|default:'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance request tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'list_request' %}">Maintenance request tracker</a>
      <a class="btn btn-outline-light" href="{% url 'create_request' %}">New request</a>
      <a class="btn btn-outline-light" href="{% url 'settings' %}">Settings</a>
    </div>
  </nav>

  <main class="container mt-4">
    <h1 class="mb-4">{% block heading %}{% endblock %}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
